[package]
name = "isomer"
version = "0.4.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Supply-chain attack detection at a molecular level"
repository = "https://github.com/atomdrift-project/isomer"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
# default-features = false drops cleave's jemalloc default (matches scan).
# The git source is declared without a rev, like scan's dependencies; the
# resolved commit remains pinned in Cargo.lock and cargo update advances it.
cleave = { git = "https://github.com/atomdrift-project/cleave.git", default-features = false }
# Same major as cleave's, so the theme's painters and our override agree on
# one global colorize state.
colored = "3.1"
# Identity types, for the signer/publisher delta. Same source as cleave/scan
# so it unifies to one version in the graph.
filefacts = { git = "https://github.com/atomdrift-project/filefacts.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# atomdrift-scan (lib name `scan`) supplies the azoth ML model for risk
# scoring each side of the diff, and will later drive purl/oci fetching,
# bloom skipping, and hopper mirroring. The resolved commit is pinned in
# Cargo.lock and advances with cargo update, like cleave above.
atomdrift-scan = { git = "https://github.com/atomdrift-project/scan.git" }

# `isomer ci` materializes the changed files into a scratch tree; tempfile
# owns its lifetime and permissions. Already in the graph via scan.
tempfile = "3"

# Mirrors scan's [workspace.lints], plus `unsafe_code = "deny"` — isomer has no
# reason to write any unsafe at all, so it forbids the block outright rather
# than only policing unsafe_op_in_unsafe_fn. Keep in sync with ../scan; a lint
# that fires there should fire here.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
unused_imports = "deny"
unused_mut = "deny"
dead_code = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
noop_method_call = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
result_unit_err = "deny"
result_large_err = "deny"
missing_safety_doc = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
unnecessary_wraps = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
wildcard_imports = "warn"
string_slice = "warn"
dbg_macro = "deny"
large_futures = "warn"
map_err_ignore = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"

# The debug binary's unwind tables outgrew the 16MB Mach-O `__eh_frame` limit,
# so ld fell back to the long-form encoding and warned on every build. isomer
# never unwinds by design — errors are `Result`, a panic is a bug — so aborting
# drops the tables and the warning with them. Cargo ignores `panic` for the test
# profile, so `cargo test` still unwinds and reports failures one at a time.
[profile.dev]
panic = "abort"
# Full DWARF for 500+ dependencies is what made target/debug tens of gigabytes
# and slowed every link. Line tables still give file:line in backtraces, which
# is all a `Result`-only codebase ever needs from a debug build.
debug = "line-tables-only"

# Optimize every dependency in debug builds, isomer's own code excepted. A
# debug cleave spends ~13s per invocation parsing traits and compiling regexes
# before it looks at the first byte — 11x the release binary — which makes
# `cargo run` and the integration tests (they spawn target/debug/isomer)
# painful. Dependencies compile once and cache, so this is paid on the first
# build only, while edits to src/ still relink in a second or two.
[profile.dev.package."*"]
opt-level = 3

# Thin LTO + cu=16 keeps most of fat LTO's runtime gain at roughly a third of
# the link time — the right default for everyday `cargo build --release`.
[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 16

# Distribution profile: fat LTO + single codegen unit. Squeezes out the last
# few percent of runtime at the cost of multi-minute link times. release.yml
# builds every shipped binary with this.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

# Release-speed scanning without release-speed linking, for the build-then-run
# targets (`make demo`, `make validate-samples`). Dropping LTO and widening the
# codegen split turns a whole-program relink into a per-unit one; the binary
# scans a few percent slower, which is noise beside the sample corpus's I/O.
# Nothing ships from this profile — `make release` and release.yml are
# untouched.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

[patch.crates-io]
# Mirrors cleave's patch section — patches only apply at the workspace root,
# so isomer must carry them itself. tree-sitter 0.27 is unpublished
# (crates.io tops out at 0.26.x) and cleave requires it; both tree-sitter
# crates must come from the same source. Keep the rev in lockstep with
# cleave/scan; remove when a crates.io release lands.
wasmtime = { git = "https://github.com/tstromberg/wasmtime.git", branch = "freebsd-aarch64-43.0.2" }
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "963b5a5a971021359cf091a63d4f1286bc319643" }
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "963b5a5a971021359cf091a63d4f1286bc319643" }

