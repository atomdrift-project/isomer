# Lint and test on every push and PR.
#
# Hardening notes — a supply-chain scanner is itself a supply-chain target, so
# this mirrors ../scan's ci.yml:
#
#   * Every action is pinned to a full commit SHA. Tags are mutable; a
#     compromised upstream can move `v4` at any time. .github/dependabot.yml
#     proposes the bumps so pinning doesn't mean going stale.
#   * `permissions: {}` at the top level. Each job opts in to exactly what it
#     needs; nothing here needs more than `contents: read`.
#   * `persist-credentials: false` on every checkout, so the job token is never
#     written into .git/config where a build script (this graph runs hundreds,
#     via cleave -> yara-x -> wasmtime) could read it back out.
#   * Trigger is `pull_request`, never `pull_request_target`: fork PRs run with
#     a read-only token and no access to secrets.
#   * Every cargo invocation is `--locked`. Without it a drifting git dep could
#     swap a dependency out from under the build, and Cargo.lock is the only
#     thing pinning cleave/scan/filefacts to reviewed revisions.
#
# The lint and test steps shell out to `make lint` / `make test` rather than
# repeating the cargo invocations. Scan duplicates them with a "keep in sync"
# comment; calling the Makefile means they cannot drift in the first place.
#
# Smoke tests are deliberately `--version`/`--help` only: a real analysis
# bootstraps scan's model bundle over the network on first run, which we don't
# want CI depending on.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # isomer links scan's model loader; keep it from reaching for the network.
  SCAN_NO_UPDATE: "1"
  SCAN_NO_UPDATE_CHECK: "1"

jobs:
  # Cheapest job, highest value, and the one that catches the mistake this repo
  # is most prone to: isomer develops against sibling checkouts (../cleave,
  # ../scan, ../filefacts), and a committed `path = "../"` builds against a
  # crate that exists on no other machine. Mirrors scripts/pre-commit.
  guard:
    name: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject local path overrides
        # Same regex as scripts/pre-commit, including the `[^#]` guard that
        # keeps commented-out overrides (Cargo.toml keeps a running log of
        # them) from tripping it. Keep the two in sync.
        run: |
          if grep -nE '^[[:space:]]*[^#].*path[[:space:]]*=[[:space:]]*"\.\.' Cargo.toml; then
            echo "::error file=Cargo.toml::local path override committed - push the dep and pin a git rev instead"
            exit 1
          fi

      - name: Cache cargo home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Registry + git checkouts only, never target/. The git deps are
          # large and re-cloned on every miss; target/ dirs for this graph run
          # to tens of GB and would blow the 10 GB per-repo cache budget.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-guard-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-guard-${{ runner.os }}-

      # rustfmt --check, then clippy --locked --all-targets -- -D warnings.
      - run: make lint

      # A `--locked` build fails outright on a stale lockfile, but this catches
      # the subtler case of a lockfile that resolves but wasn't committed.
      - name: Cargo.lock unchanged
        run: git diff --exit-code Cargo.lock

  # Not gated on `guard`: a cold build of this graph is long, and serializing
  # it behind clippy would double the wall clock for no safety gain.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-test-${{ runner.os }}-

      - run: cargo test --locked --quiet

      - name: Smoke
        run: |
          cargo build --locked --bin isomer
          ./target/debug/isomer --version
          ./target/debug/isomer --help
